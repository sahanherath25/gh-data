name: Test Workkflow
on:
  push:
    branches:
      - 'dev-*'
      - "lead-dev"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get the Code From Rep
        uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Dependencies
        run: npm ci
      - name: Running the Test
        run: echo "Testing in the Server...."
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Get the Code From Rep
        uses: actions/checkout@v4
      - name: Install Dependencies
        run: npm ci
      - name: Build Website
        run: npm run build
      - name: Upload Artifact
        uses: actions/upload-artifact@v3.1.3
        with:
          name: dist-files
          path: dist







